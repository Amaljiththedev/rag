[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-production-system"
version = "0.1.0"
description = "Enterprise RAG Pipeline with Hybrid Retrieval and Evaluation Harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.1",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.7",
    "langchain-community>=0.2.0",
    "langgraph>=0.0.55",
    "openai>=1.30.0",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sentence-transformers",
    "psycopg2-binary"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]
